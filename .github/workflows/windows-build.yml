name: Windows build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config

      - name: Restore
        run: dotnet restore Vanta.sln -p:Platform=x64

      - name: Build
        run: dotnet build Vanta.sln -c Debug -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test Vanta.Tests\Vanta.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=vanta-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanta-test-results
          path: Vanta.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
